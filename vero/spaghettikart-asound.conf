# ALSA configuration for SpaghettiKart, loaded through ALSA_CONFIG_PATH by spaghettikart-run.sh.
# Keeps the complete system configuration and adds the "spaghettikart" device.
</usr/share/alsa/alsa.conf>

# The game mixes at 26800 Hz. The HDMI hardware accepts that rate, but TVs stay silent, so convert to 48 kHz.
# Exclusive access: MPD and Raspotify cannot play while the game runs.
pcm.spaghettikart {
    type plug
    rate_converter [ "samplerate" "speexrate" "linear" ]
    slave {
        pcm "hdmi:CARD=AMLMESONAUDIO,DEV=0"
        rate 48000
    }
}
